<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Submission Portal</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            margin-top: 10px;
            background: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1a252f;
        }

        .admin-link {
            margin-top: 15px;
            display: block;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Assignment Submission Portal</h1>

        <p>
            Submit your assignment files securely and efficiently.
            All submissions are tracked and recorded for academic review.
        </p>

        <a class="btn" href="{{ url_for('submit') }}">Submit Assignment</a>

        <a class="admin-link" href="{{ url_for('admin') }}">Lecturer Access</a>

    </div>

</body>
</html>
